[project]
name = "bugfinder"
version = "1.0.6"
description = "An old-fashioned, modern-background console game made in Python"
readme = "README.md"
authors = [{ name = "BretRen", email = "bretren2013@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["pyfiglet>=1.0.4", "pyinstaller>=6.22.3", "textual>=8.2.8"]

[project.scripts]
bugfinder = "bugfinder.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["build>=1.6.1", "twine>=7.0.0"]
